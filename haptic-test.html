<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Проверка вибрации 2</title>
<style>
  body { font: 17px/1.4 -apple-system, system-ui, sans-serif; background: #f7f5fe; color: #1c1938; margin: 0; padding: 24px 16px 40px }
  h1 { font-size: 24px; margin: 0 0 6px }
  p { margin: 0 0 20px; color: #7c7894; font-size: 15px }
  .row { position: relative; display: flex; align-items: center; gap: 14px; margin: 0 0 12px; padding: 16px; border-radius: 14px; background: #fff; box-shadow: 0 6px 20px -12px rgba(60, 40, 140, .35) }
  .ck { position: relative; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #7556ee; flex: none }
  .ck.on { background: #7556ee }
  .ck input { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); margin: 0; cursor: pointer }
  .o0 input { opacity: 0 }
  .o1 input { opacity: .01 }
  b { color: #7556ee; font-size: 22px; margin-left: auto }
  #log { color: #7c7894; font-size: 14px }
</style>
</head>
<body>
<h1>Проверка вибрации 2</h1>
<p>Нажмите прямо на кружок в каждой строке. Кружок закрасится. Запомните, в каких строках был «тик».</p>

<div class="row"><span class="ck o0" data-n="1"><input type="checkbox" switch></span><span>Невидимый переключатель на кружке</span><b>1</b></div>
<div class="row"><span class="ck o1" data-n="2"><input type="checkbox" switch></span><span>Почти невидимый переключатель на кружке</span><b>2</b></div>
<div class="row"><span class="ck o0" data-n="3" data-prevent="1"><input type="checkbox" switch></span><span>Невидимый, но приложение «перехватывает» нажатие</span><b>3</b></div>
<div class="row"><span class="ck" data-n="4"><input type="checkbox" switch style="opacity:1;inset:auto;width:auto;height:auto;position:static;margin-left:40px"></span><span>Видимый переключатель (для сравнения)</span><b>4</b></div>
<p id="log"></p>

<script>
  document.addEventListener('click', (e) => {
    const ck = e.target.closest('.ck');
    if (!ck) return;
    if (ck.dataset.prevent) e.preventDefault();
    ck.classList.toggle('on');
    document.getElementById('log').textContent = 'Нажата строка ' + ck.dataset.n;
  });
</script>
</body>
</html>
